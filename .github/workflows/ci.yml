name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: nothing big is tracked
        shell: bash
        run: |
          # A repository carries what it is given for ever. `go build` on a main
          # package writes an executable into the working tree, named after the
          # package, and one sweeping add later it is in the history of every
          # clone. That happened here: traydemo, 3.5 MB of a 5 MB repository.
          #
          # A megabyte is the line. Nothing this repository legitimately tracks
          # comes near it: the largest source file is a few tens of kilobytes.
          big=$(git ls-files -z | xargs -0 -I{} find {} -type f -size +1024k -print)
          if [ -n "$big" ]; then
            echo "$big" | while read -r f; do
              echo "::error file=$f::$f is $(du -h "$f" | cut -f1) and is tracked; \
          a repository keeps what it is given for ever"
            done
            exit 1
          fi
          echo "nothing tracked is over a megabyte"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: test + 100% coverage gate on the portable code
        run: |
          # The gate selects by SHAPE rather than by a build tag, which is what
          # the rest of this fleet does. Everything that is not a platform file
          # -- Go's own _darwin/_linux/_windows/_android/_js/_other suffixes --
          # is held at 100%, so a new portable file is gated the day it is
          # written instead of the day somebody remembers to add it.
          #
          # It used to be a build tag, and the tag was on the WRONG THING: the
          # native backends were opt-in, so `tray.New(...).Run()` in an ordinary
          # program returned ErrNoBackend and put no icon anywhere. A library
          # whose default is "does nothing, quietly" to protect its own coverage
          # figure is a library that has put its CI ahead of its callers.
          go list ./... | grep -v /examples/ |
            xargs go test -covermode=atomic -coverprofile=cov.out
          go tool cover -func=cov.out \
            | grep -vE '_(darwin|linux|android|windows|js|other)\.go:' \
            | grep -v '^total:' > portable.txt || true
          cat portable.txt
          if [ ! -s portable.txt ]; then
            echo "::error::no portable files were measured at all; the filter is wrong"; exit 1
          fi
          if grep -v '100\.0%' portable.txt; then
            echo "::error::the portable code is below 100% (lines above)"; exit 1
          fi
          echo "portable code: 100%"
  # The native backend was BUILT here for a long time and never RUN. That is
  # how `go test -tags tray_native ./...` came to die on SIGTRAP over a suite
  # CI reported as green: two assertions written for the untagged build entered
  # [NSApp run] from a goroutine, and AppKit traps rather than fails.
  #
  # Compiling a backend proves the calls exist. Running it is what proves they
  # answer.
  #
  # The live tests skip themselves when there is no window server, so this lane
  # is meaningful on a runner with one and honest on a runner without.
  darwin-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: test with the native backend linked in
        env: { CGO_ENABLED: "0" }
        run: go test -tags tray_native ./...
      - name: say whether the live suite RAN or skipped
        # A green lane that skipped everything is the same blind spot in a new
        # place. The live tests skip themselves without a window server, so the
        # log has to say which happened rather than leaving "ok" to imply it.
        env: { CGO_ENABLED: "0" }
        run: go test -tags tray_native -run Live -v ./...
      - name: test without it, on darwin too
        env: { CGO_ENABLED: "0" }
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: build core
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", CGO_ENABLED: "0" }
        run: go build ./...
      - name: build native backend (-tags tray_native)
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", CGO_ENABLED: "0" }
        run: go build -tags tray_native ./...
