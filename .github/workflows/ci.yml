name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: test + 100% coverage gate
        run: |
          pkgs=$(go list ./... | grep -v /examples/)
          go test $pkgs -covermode=atomic -coverprofile=cov.out
          total=$(go tool cover -func=cov.out | awk '/^total:/{print $3}')
          echo "coverage: $total"
          [ "$total" = "100.0%" ] || { go tool cover -func=cov.out | awk '$3!="100.0%"'; exit 1; }
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - name: build core
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", CGO_ENABLED: "0" }
        run: go build ./...
      - name: build native backend (-tags tray_native)
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", CGO_ENABLED: "0" }
        run: go build -tags tray_native ./...
